name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET 8 einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore tests/DocumentAssistant.Tests/DocumentAssistant.Tests.csproj

      - name: Bauen
        run: dotnet build tests/DocumentAssistant.Tests/DocumentAssistant.Tests.csproj --no-restore --configuration Release

      - name: Tests ausführen
        run: dotnet test tests/DocumentAssistant.Tests/DocumentAssistant.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Docker-Image bauen
        run: docker build -t ai-document-assistant .
