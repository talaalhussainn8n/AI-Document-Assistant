name: AI-Document-Assistant_CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET 8 einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore src/DocumentAssistant.Api/DocumentAssistant.Api.csproj

      - name: Abhängigkeiten erstellen
        run: dotnet build src/DocumentAssistant.Api/DocumentAssistant.Api.csproj --no-restore --configuration Release
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET 8 einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          
      - name: Tests ausführen
        run: dotnet test tests/DocumentAssistant.Tests/DocumentAssistant.Tests.csproj --configuration Release
